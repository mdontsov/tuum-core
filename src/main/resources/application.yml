spring:
  application:
    name: core-banking
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${SPRING_DATASOURCE_USERNAME:banking}
    password: ${SPRING_DATASOURCE_PASSWORD:banking}
    hikari:
      maximum-pool-size: 20
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:banking}
    password: ${SPRING_RABBITMQ_PASSWORD:banking}
    publisher-confirm-type: correlated
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

banking:
  outbox:
    fixed-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}

server:
  shutdown: graceful
